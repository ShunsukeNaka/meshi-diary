# Apache2 から API（127.0.0.1:8080）に転送する設定。
# https://<サーバーのドメイン>/meshi-diary-api/ へのリクエストを、/meshi-diary-api を外して API に送る
# （例: /meshi-diary-api/health → http://127.0.0.1:8080/health）。
#
# サーバーの /etc/apache2/meshi-diary-api.conf に置き、<サーバーのドメイン> の HTTPS の VirtualHost（*:443）の中に
#   Include /etc/apache2/meshi-diary-api.conf
# と書いて読み込む。ほかのサイトに影響しないよう、サーバー全体の設定（a2enconf）にはしない。
ProxyPass        /meshi-diary-api/ http://127.0.0.1:8080/
ProxyPassReverse /meshi-diary-api/ http://127.0.0.1:8080/

# API はセッション Cookie を Path=/ で返す。そのままだと同じドメインのほかのサイトにも送られ、
# 名前（session）もぶつかりうるので、/meshi-diary-api/ の下だけに送られるようにする
ProxyPassReverseCookiePath / /meshi-diary-api/
